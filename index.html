<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>党建知识覆盖练习</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --primary: #b42318;
      --primary-2: #8f1f14;
      --primary-soft: #fff0ed;
      --blue: #175cd3;
      --green: #067647;
      --bad: #b42318;
      --shadow: 0 14px 38px rgba(15, 23, 42, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(180, 35, 24, 0.06), transparent 260px),
        var(--bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: var(--radius);
      font-weight: 700;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: .55; transform: none; }

    .page {
      width: min(1240px, calc(100% - 28px));
      margin: 22px auto 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 2px 20px;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      color: #111827;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 760px;
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel, .question-card, .summary, .knowledge-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      position: sticky;
      top: 16px;
      padding: 18px;
    }

    .panel h2 {
      font-size: 17px;
      margin-bottom: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 13px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select, input[type="search"], input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
      line-height: 1.75;
    }

    select:focus, input:focus, textarea:focus {
      border-color: rgba(23, 92, 211, .55);
      box-shadow: 0 0 0 3px rgba(23, 92, 211, .1);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
      background: var(--surface-2);
      border-radius: var(--radius);
      margin-bottom: 14px;
    }

    .mode-tabs button {
      min-height: 38px;
      padding: 8px 6px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
    }

    .mode-tabs button.active {
      background: #fff;
      color: var(--primary-2);
      box-shadow: 0 1px 5px rgba(15, 23, 42, .08);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 14px 0;
    }

    .stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      color: var(--primary-2);
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .primary {
      background: var(--primary);
      color: #fff;
      padding: 12px 14px;
      box-shadow: 0 10px 20px rgba(180, 35, 24, .2);
    }

    .secondary {
      background: #eef4ff;
      color: #1849a9;
      padding: 12px 14px;
    }

    .ghost {
      background: #fff;
      color: var(--text);
      padding: 11px 14px;
      border: 1px solid var(--line);
    }

    .mini-note {
      margin-top: 14px;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--primary-soft);
      color: #7a271a;
      line-height: 1.65;
      font-size: 13px;
    }

    .content {
      display: grid;
      gap: 14px;
    }

    .summary {
      display: none;
      padding: 16px 18px;
      border-left: 4px solid var(--primary);
    }

    .summary.show { display: block; }

    .summary strong {
      display: block;
      font-size: 22px;
      color: var(--primary-2);
      margin-bottom: 6px;
    }

    .summary span {
      color: var(--muted);
      line-height: 1.6;
    }

    .paper {
      display: grid;
      gap: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 2px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .question-card {
      padding: 18px;
    }

    .question-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .question-title {
      font-size: 17px;
      line-height: 1.62;
      font-weight: 700;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #475467;
      font-size: 12px;
      font-weight: 700;
    }

    .tag.type { background: #eef4ff; color: #1849a9; }

    .options {
      display: grid;
      gap: 9px;
    }

    .option {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fcfcfd;
      line-height: 1.62;
    }

    .option input {
      margin-top: 4px;
      accent-color: var(--primary);
    }

    .result {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--radius);
      line-height: 1.7;
      font-size: 14px;
      border: 1px solid var(--line);
      background: #fbfcfe;
    }

    .result.show { display: block; }
    .result.correct { border-color: rgba(6, 118, 71, .35); background: #ecfdf3; }
    .result.incorrect { border-color: rgba(180, 35, 24, .35); background: #fff1f0; }

    .result-title {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .knowledge-full {
      margin-top: 10px;
      padding: 12px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .72);
      border: 1px dashed rgba(102, 112, 133, .35);
      white-space: pre-line;
    }

    .knowledge-panel {
      padding: 16px;
      display: none;
    }

    .knowledge-panel.show { display: block; }

    .knowledge-panel h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .knowledge-list {
      display: grid;
      gap: 10px;
      max-height: 520px;
      overflow: auto;
      padding-right: 4px;
    }

    .knowledge-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fcfcfd;
    }

    .knowledge-item h3 {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .knowledge-item p {
      color: #344054;
      line-height: 1.65;
      font-size: 13px;
      white-space: pre-line;
    }

    .footer-note {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 10px 0 0;
    }

    .back-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 12px 28px rgba(180, 35, 24, .28);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease, background .18s ease;
      font-size: 22px;
      line-height: 1;
    }

    .back-top.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .back-top:hover {
      background: var(--primary-2);
    }

    @media (max-width: 900px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 18px, 1240px);
        margin-top: 10px;
      }

      h1 { font-size: 23px; }
      .question-head { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }

      .back-top {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>党建知识覆盖练习</h1>
        <p class="subtitle">题目已按“知识点.txt”整理为固定题库，包含选择题、填空题、简答题。简答题直接对照标准答案作答，点击“显示答案”可随时查看。</p>
      </div>
      <div class="pill" id="coveragePill">知识点 0 个</div>
    </header>

    <div class="layout">
      <aside class="panel">
        <h2>练习设置</h2>
        <div class="mode-tabs" role="tablist" aria-label="练习模式">
          <button data-mode="cover">顺序覆盖</button>
          <button class="active" data-mode="random">随机组卷</button>
          <button data-mode="wrong">错题复习</button>
        </div>

        <div class="field">
          <label for="sourceFilter">知识范围</label>
          <select id="sourceFilter"></select>
        </div>

        <div class="field">
          <label for="batchSize">每套题量</label>
          <select id="batchSize">
            <option value="20" selected>20 题</option>
            <option value="30">30 题</option>
            <option value="50">50 题</option>
            <option value="100">全部题目</option>
          </select>
        </div>

        <div class="field">
          <label for="knowledgeSearch">搜索知识点</label>
          <input id="knowledgeSearch" type="search" placeholder="输入标题、来源或内容">
        </div>

        <div class="stats">
          <div class="stat">
            <strong id="paperNo">第 1 套</strong>
            <span>当前组卷</span>
          </div>
          <div class="stat">
            <strong id="questionCount">0 题</strong>
            <span>本套题量</span>
          </div>
          <div class="stat">
            <strong id="scoreText">未提交</strong>
            <span>客观题得分</span>
          </div>
          <div class="stat">
            <strong id="wrongCount">0</strong>
            <span>错题本</span>
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="submitBtn">提交并查看结果</button>
          <button class="secondary" id="nextBtn">生成下一套</button>
          <button class="ghost" id="resetBtn">清空本套作答</button>
          <button class="ghost" id="toggleKnowledgeBtn">显示知识库</button>
        </div>

        <div class="mini-note" id="tipsBox">
          所有题目都来自“知识点.txt”整理后的固定题库。默认随机抽题，并尽量均衡题型分布；简答题直接展示标准答案供对照。
        </div>
      </aside>

      <section class="content">
        <div class="summary" id="summary"></div>
        <section class="knowledge-panel" id="knowledgePanel">
          <h2>知识库</h2>
          <div class="knowledge-list" id="knowledgeList"></div>
        </section>
        <div class="paper" id="paper"></div>
        <p class="footer-note">默认随机刷题更适合日常练习，顺序覆盖适合系统过一遍全部题库。</p>
      </section>
    </div>
    <button class="back-top" id="backTopBtn" type="button" aria-label="回到顶部" title="回到顶部">↑</button>
  </main>

  <script src="coverage-data.js"></script>
  <script>
    const points = Array.isArray(window.knowledgePoints) ? window.knowledgePoints : [];
    const questionBank = Array.isArray(window.questionBank) ? window.questionBank : [];
    const pointMap = new Map(points.map(point => [point.id, point]));
    const STORAGE_KEY = "partyKnowledgeWrongIdsV3";
    const RECENT_RANDOM_KEY = "partyKnowledgeRecentRandomIdsV1";

    const typeNames = {
      single: "单选题",
      multiple: "多选题",
      blank: "填空题",
      short: "简答题"
    };
    const typeOrder = ["single", "multiple", "blank", "short"];
    const sectionNames = {
      single: "一、单项选择题",
      multiple: "二、多项选择题",
      blank: "三、填空题",
      short: "四、简答题"
    };

    const state = {
      mode: "random",
      paperNo: 1,
      cursor: 0,
      submitted: false,
      currentPaper: [],
      knowledgeShown: false
    };

    const paperEl = document.getElementById("paper");
    const summaryEl = document.getElementById("summary");
    const paperNoEl = document.getElementById("paperNo");
    const questionCountEl = document.getElementById("questionCount");
    const scoreTextEl = document.getElementById("scoreText");
    const wrongCountEl = document.getElementById("wrongCount");
    const coveragePillEl = document.getElementById("coveragePill");
    const sourceFilterEl = document.getElementById("sourceFilter");
    const batchSizeEl = document.getElementById("batchSize");
    const knowledgeSearchEl = document.getElementById("knowledgeSearch");
    const knowledgePanelEl = document.getElementById("knowledgePanel");
    const knowledgeListEl = document.getElementById("knowledgeList");
    const toggleKnowledgeBtn = document.getElementById("toggleKnowledgeBtn");
    const backTopBtn = document.getElementById("backTopBtn");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalize(text) {
      return String(text || "")
        .replace(/\s+/g, "")
        .replace(/[，。、“”‘’；：！？（）《》【】,.!?;:()[\]{}"']/g, "")
        .trim();
    }

    function getWrongIds() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveWrongIds(ids) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...new Set(ids)]));
      updateWrongCount();
    }

    function getRecentRandomIds() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_RANDOM_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveRecentRandomIds(ids) {
      localStorage.setItem(RECENT_RANDOM_KEY, JSON.stringify([...new Set(ids)]));
    }

    function rememberRecentRandomIds(ids, maxCount) {
      const merged = ids.concat(getRecentRandomIds().filter(id => !ids.includes(id)));
      saveRecentRandomIds(merged.slice(0, maxCount));
    }

    function updateWrongCount() {
      wrongCountEl.textContent = getWrongIds().length;
    }

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getPoint(question) {
      return pointMap.get(question.pointId) || {
        id: question.pointId || question.id,
        source: question.source || "未分类",
        no: "--",
        title: question.prompt,
        answer: question.answerText || ""
      };
    }

    function getFilteredQuestions() {
      const source = sourceFilterEl.value;
      const q = normalize(knowledgeSearchEl.value);
      return questionBank.filter(question => {
        const point = getPoint(question);
        const inSource = source === "all" || question.source === source;
        const inSearch = !q || normalize(`${question.source}${question.prompt}${question.answerText || ""}${point.title}${point.answer}`).includes(q);
        return inSource && inSearch;
      });
    }

    function pickBalancedRandom(filtered, size) {
      const recentSet = new Set(getRecentRandomIds());
      const preferFresh = list => {
        const shuffled = shuffle(list);
        return shuffled.filter(question => !recentSet.has(question.id))
          .concat(shuffled.filter(question => recentSet.has(question.id)));
      };
      const groups = {
        single: preferFresh(filtered.filter(question => question.type === "single")),
        multiple: preferFresh(filtered.filter(question => question.type === "multiple")),
        blank: preferFresh(filtered.filter(question => question.type === "blank")),
        short: preferFresh(filtered.filter(question => question.type === "short"))
      };

      const weights = {
        single: 0.42,
        multiple: 0.18,
        blank: 0.3,
        short: 0.1
      };

      const quotas = {};
      let assigned = 0;
      typeOrder.forEach(type => {
        const target = Math.floor(size * weights[type]);
        quotas[type] = Math.min(target, groups[type].length);
        assigned += quotas[type];
      });

      while (assigned < size) {
        let filled = false;
        for (const type of typeOrder) {
          if (assigned >= size) break;
          if (quotas[type] < groups[type].length) {
            quotas[type] += 1;
            assigned += 1;
            filled = true;
          }
        }
        if (!filled) break;
      }

      const chosen = [];
      typeOrder.forEach(type => {
        chosen.push(...groups[type].slice(0, quotas[type]));
      });
      return shuffle(chosen).slice(0, size);
    }

    function pickPaper() {
      const filtered = getFilteredQuestions();
      const size = Math.min(Number(batchSizeEl.value), filtered.length || 0);
      if (!filtered.length) return [];

      let chosen = [];
      if (state.mode === "random") {
        chosen = pickBalancedRandom(filtered, size);
      } else if (state.mode === "wrong") {
        const wrongSet = new Set(getWrongIds());
        chosen = pickBalancedRandom(filtered.filter(question => wrongSet.has(question.id)), size);
      } else {
        if (state.cursor >= filtered.length) state.cursor = 0;
        chosen = filtered.slice(state.cursor, state.cursor + size);
        if (chosen.length < size) chosen = chosen.concat(filtered.slice(0, size - chosen.length));
        state.cursor = (state.cursor + size) % filtered.length;
      }

      if (state.mode === "random") {
        rememberRecentRandomIds(chosen.map(question => question.id), Math.max(size * 4, 80));
      }

      return chosen
        .sort((a, b) => {
          const typeDelta = typeOrder.indexOf(a.type) - typeOrder.indexOf(b.type);
          if (typeDelta !== 0) return typeDelta;
          return questionBank.findIndex(item => item.id === a.id) - questionBank.findIndex(item => item.id === b.id);
        })
        .map((question, index) => ({
        ...question,
        point: getPoint(question),
        uid: `${question.id}-${index}-${Date.now()}`
      }));
    }

    function getAnswerHtml(question) {
      if (question.type === "single") {
        return `正确答案：${String.fromCharCode(65 + question.answer)}. ${escapeHtml(question.options[question.answer])}`;
      }
      if (question.type === "multiple") {
        return `正确答案：${question.answer.map(index => `${String.fromCharCode(65 + index)}. ${escapeHtml(question.options[index])}`).join("；")}`;
      }
      return `标准答案：${escapeHtml(question.answerText || question.point.answer)}`;
    }

    function renderPaper() {
      paperEl.innerHTML = "";
      if (!state.currentPaper.length) {
        paperEl.innerHTML = `<article class="question-card"><div class="question-title">当前条件下没有可用题目。</div><div class="meta"><span class="tag">请调整知识范围、搜索词，或先完成错题积累</span></div></article>`;
        return;
      }

      const head = document.createElement("div");
      head.className = "section-head";
      head.innerHTML = `<span>本套共 ${state.currentPaper.length} 题</span><span>${state.mode === "cover" ? "按顺序推进" : state.mode === "wrong" ? "来自错题本" : "随机抽取"}</span>`;
      paperEl.appendChild(head);

      let currentType = "";
      let sectionQuestionNo = 0;
      state.currentPaper.forEach(question => {
        if (question.type !== currentType) {
          currentType = question.type;
          sectionQuestionNo = 0;
          const sectionCount = state.currentPaper.filter(item => item.type === currentType).length;
          const sectionHead = document.createElement("div");
          sectionHead.className = "section-head";
          sectionHead.innerHTML = `<span>${sectionNames[currentType]}</span><span>${sectionCount} 题</span>`;
          paperEl.appendChild(sectionHead);
        }
        sectionQuestionNo += 1;

        const card = document.createElement("article");
        card.className = "question-card";
        card.dataset.uid = question.uid;
        card.dataset.type = question.type;

        let body = "";
        if (question.type === "single" || question.type === "multiple") {
          const inputType = question.type === "single" ? "radio" : "checkbox";
          const name = `q-${question.uid}`;
          body = `<div class="options">
            ${question.options.map((option, optionIndex) => `
              <label class="option">
                <input type="${inputType}" name="${name}" value="${optionIndex}">
                <span>${String.fromCharCode(65 + optionIndex)}. ${escapeHtml(option)}</span>
              </label>
            `).join("")}
          </div>`;
        } else if (question.type === "blank") {
          body = `<input class="blank-input" type="text" placeholder="请输入答案">`;
        } else {
          body = `<textarea class="short-answer" placeholder="请输入完整答案"></textarea>`;
        }

        card.innerHTML = `
          <div class="question-head">
            <div>
              <div class="question-title">${sectionQuestionNo}. ${escapeHtml(question.prompt)}</div>
              <div class="meta">
                <span class="tag type">${typeNames[question.type]}</span>
                <span class="tag">${escapeHtml(question.point.source)}</span>
                <span class="tag">${escapeHtml(question.point.no)} ${escapeHtml(question.point.title)}</span>
              </div>
            </div>
          </div>
          ${body}
          <div class="meta">
            <button class="ghost show-answer-btn" type="button">显示答案</button>
          </div>
          <div class="result"></div>
        `;
        paperEl.appendChild(card);
      });
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      const aa = [...a].sort((x, y) => x - y);
      const bb = [...b].sort((x, y) => x - y);
      return aa.every((value, index) => value === bb[index]);
    }

    function showResult(card, question, html, correct) {
      const result = card.querySelector(".result");
      result.className = `result show ${correct ? "correct" : "incorrect"}`;
      result.innerHTML = `
        ${html}
        <div class="knowledge-full"><strong>完整知识点：</strong>
${escapeHtml(question.point.answer)}</div>
      `;
    }

    function markWrong(questionId, isWrong) {
      const ids = new Set(getWrongIds());
      if (isWrong) ids.add(questionId);
      else ids.delete(questionId);
      saveWrongIds([...ids]);
    }

    function revealAnswer(card, question) {
      const result = card.querySelector(".result");
      result.className = "result show";
      result.innerHTML = `
        <div class="result-title">标准答案</div>
        <div>${getAnswerHtml(question)}</div>
        <div class="knowledge-full"><strong>完整知识点：</strong>
${escapeHtml(question.point.answer)}</div>
      `;
    }

    function submitPaper() {
      let autoScore = 0;
      let autoTotal = 0;
      let shortTotal = 0;

      state.currentPaper.forEach(question => {
        const card = paperEl.querySelector(`[data-uid="${question.uid}"]`);
        let correct = true;

        if (question.type === "single") {
          autoTotal += 1;
          const selected = card.querySelector("input:checked");
          const value = selected ? Number(selected.value) : -1;
          correct = value === question.answer;
          if (correct) autoScore += 1;
          showResult(card, question, `
            <div class="result-title">${correct ? "回答正确" : "回答有误"}</div>
            <div>正确答案：${String.fromCharCode(65 + question.answer)}. ${escapeHtml(question.options[question.answer])}</div>
          `, correct);
        }

        if (question.type === "multiple") {
          autoTotal += 1;
          const selected = [...card.querySelectorAll("input:checked")].map(item => Number(item.value));
          correct = arraysEqual(selected, question.answer);
          if (correct) autoScore += 1;
          const answerText = question.answer.map(index => `${String.fromCharCode(65 + index)}. ${escapeHtml(question.options[index])}`).join("；");
          showResult(card, question, `
            <div class="result-title">${correct ? "回答正确" : "回答有误"}</div>
            <div>正确答案：${answerText}</div>
          `, correct);
        }

        if (question.type === "blank") {
          autoTotal += 1;
          const input = normalize(card.querySelector(".blank-input").value);
          const target = normalize(question.answerText);
          correct = input && (input.includes(target) || target.includes(input));
          if (correct) autoScore += 1;
          showResult(card, question, `
            <div class="result-title">${correct ? "填写正确" : "填写有误"}</div>
            <div>标准答案：${escapeHtml(question.answerText)}</div>
          `, correct);
        }

        if (question.type === "short") {
          shortTotal += 1;
          const text = normalize(card.querySelector(".short-answer").value);
          const answer = normalize(question.answerText || question.point.answer);
          correct = !!text && (text.includes(answer) || answer.includes(text));
          showResult(card, question, `
            <div class="result-title">${correct ? "答案基本匹配" : "请对照标准答案查看"}</div>
            <div>标准答案：${escapeHtml(question.answerText || question.point.answer)}</div>
          `, correct);
          return;
        }

        markWrong(question.id, !correct);
      });

      state.submitted = true;
      const percent = autoTotal ? Math.round(autoScore / autoTotal * 100) : 0;
      scoreTextEl.textContent = `${autoScore} / ${autoTotal}`;
      summaryEl.className = "summary show";
      summaryEl.innerHTML = `
        <strong>客观题得分：${autoScore} / ${autoTotal}</strong>
        <span>正确率约 ${percent}%。本套含 ${shortTotal} 道简答题，已展示标准答案供直接对照；客观题答错后会加入错题复习。</span>
      `;
      summaryEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetAnswers() {
      paperEl.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => input.checked = false);
      paperEl.querySelectorAll(".blank-input, .short-answer").forEach(input => input.value = "");
      paperEl.querySelectorAll(".result").forEach(result => {
        result.className = "result";
        result.innerHTML = "";
      });
      summaryEl.className = "summary";
      summaryEl.innerHTML = "";
      scoreTextEl.textContent = "未提交";
      state.submitted = false;
    }

    function generatePaper({ keepNumber = false } = {}) {
      if (!keepNumber) state.paperNo += state.paperNo === 0 ? 1 : 0;
      state.submitted = false;
      summaryEl.className = "summary";
      summaryEl.innerHTML = "";
      scoreTextEl.textContent = "未提交";
      state.currentPaper = pickPaper();
      paperNoEl.textContent = `第 ${state.paperNo} 套`;
      questionCountEl.textContent = `${state.currentPaper.length} 题`;
      renderPaper();
      renderKnowledgeList();
    }

    function nextPaper() {
      state.paperNo += 1;
      generatePaper({ keepNumber: true });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function initSources() {
      const sources = [...new Set(questionBank.map(question => question.source))];
      sourceFilterEl.innerHTML = `<option value="all">全部题库</option>` +
        sources.map(source => `<option value="${escapeHtml(source)}">${escapeHtml(source)}</option>`).join("");
    }

    function renderKnowledgeList() {
      const source = sourceFilterEl.value;
      const q = normalize(knowledgeSearchEl.value);
      const filtered = points.filter(point => {
        const inSource = source === "all" || point.source === source;
        const inSearch = !q || normalize(`${point.source}${point.title}${point.answer}`).includes(q);
        return inSource && inSearch;
      });
      knowledgeListEl.innerHTML = filtered.map(point => `
        <article class="knowledge-item">
          <h3>${escapeHtml(point.no)} ${escapeHtml(point.title)}</h3>
          <div class="meta">
            <span class="tag">${escapeHtml(point.source)}</span>
          </div>
          <p>${escapeHtml(point.answer)}</p>
        </article>
      `).join("") || `<article class="knowledge-item"><h3>没有匹配的知识点</h3><p>请调整搜索词或知识范围。</p></article>`;
    }

    document.querySelectorAll(".mode-tabs button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".mode-tabs button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        state.mode = button.dataset.mode;
        state.cursor = 0;
        state.paperNo += 1;
        generatePaper({ keepNumber: true });
      });
    });

    sourceFilterEl.addEventListener("change", () => {
      state.cursor = 0;
      state.paperNo += 1;
      generatePaper({ keepNumber: true });
    });
    batchSizeEl.addEventListener("change", () => {
      state.cursor = 0;
      state.paperNo += 1;
      generatePaper({ keepNumber: true });
    });
    knowledgeSearchEl.addEventListener("input", () => {
      state.cursor = 0;
      state.paperNo += 1;
      generatePaper({ keepNumber: true });
    });

    paperEl.addEventListener("click", event => {
      const button = event.target.closest(".show-answer-btn");
      if (!button) return;
      const card = button.closest(".question-card");
      if (!card) return;
      const question = state.currentPaper.find(item => item.uid === card.dataset.uid);
      if (!question) return;
      revealAnswer(card, question);
    });

    document.getElementById("submitBtn").addEventListener("click", submitPaper);
    document.getElementById("nextBtn").addEventListener("click", nextPaper);
    document.getElementById("resetBtn").addEventListener("click", resetAnswers);
    toggleKnowledgeBtn.addEventListener("click", () => {
      state.knowledgeShown = !state.knowledgeShown;
      knowledgePanelEl.classList.toggle("show", state.knowledgeShown);
      toggleKnowledgeBtn.textContent = state.knowledgeShown ? "隐藏知识库" : "显示知识库";
    });
    backTopBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    window.addEventListener("scroll", () => {
      backTopBtn.classList.toggle("show", window.scrollY > 420);
    }, { passive: true });

    coveragePillEl.textContent = `知识点 ${points.length} 个 / 题目 ${questionBank.length} 题`;
    state.paperNo = 1;
    initSources();
    updateWrongCount();
    generatePaper({ keepNumber: true });
  </script>
</body>
</html>
